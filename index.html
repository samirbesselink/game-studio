<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<!-- CSP: alles van de eigen site (NN5). Een verzoek naar buiten is een CSP-schending, dus een console-fout, dus een
     rode speeltest. script-src voegt aan default-src alleen de hash van de importmap hieronder toe (een inline
     script; zonder hash weigert de browser hem en laadt PlayCanvas niet). Verander je de importmap, dan verandert
     de hash: tests/speeltest.mjs rekent hem na. Geen inline stijl of blob; base en formulieren mogen nergens heen.
     In img-src staat het schema voor data-URL's alleen voor het lege favicon; bouw en check_inhoud laten dat woord
     alleen op precies die plek door. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; connect-src 'self'; style-src 'self'; script-src 'self' 'sha256-kkujwHtN9gqnd2Z8jcDcCqioBVYFfJXdyd97/Vpqag0='; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Tussen dubbele accolades (taal:sleutel) vult tools/bouw.mjs de teksten in: de terugval zolang inhoud.json
     (met de teksten) niet geladen is. Daarna zet i18n alle tekst in de gekozen taal. -->
<title>Lijfwacht · Bodyguard</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="game/stijl.css">
<script type="importmap">{ "imports": { "playcanvas": "./vendor/playcanvas.min.mjs" } }</script>
<script type="module" src="game/main.mjs"></script>
</head>
<body>
<main id="podium">
  <canvas id="doek"></canvas>
  <div id="ui">
    <div class="balk">
      <span id="level-titel" class="pil" hidden></span>
      <span id="hud-sterren" class="pil" hidden><span class="ster-teken" data-symbool aria-hidden="true">★</span> <span data-t="sterren"></span>
        <span id="aantal-sterren" data-symbool>0</span></span>
      <span id="hud-vitamine" class="pil vitamine" hidden><span data-t="vitamine"></span></span>
      <span class="ruimte"></span>
      <button id="knop-hulp" class="knop rond" type="button" data-t-aria="hulp" hidden><span data-symbool aria-hidden="true">?</span></button>
      <!-- Geluid aan/uit (ook toets M). Het icoon wisselt in stijl.css op aria-pressed: een luidspreker met golfjes of
           met een kruis (het verschil zit in de vorm, niet in de kleur). Inline SVG zonder namespace-adres (NN5). -->
      <button id="knop-geluid" class="knop rond" type="button" data-t-aria="geluid" aria-pressed="true" hidden>
        <svg class="icoon icoon-aan" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9h4l5-4v14l-5-4H3z" fill="currentColor"/><path d="M15.5 8.8a4.5 4.5 0 0 1 0 6.4M18.3 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        <svg class="icoon icoon-uit" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9h4l5-4v14l-5-4H3z" fill="currentColor"/><path d="M16 9.5l5 5M21 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
      </button>
      <button id="knop-taal" class="knop" type="button" data-t="andere_taal" hidden></button>
    </div>

    <section id="scherm-laden" class="scherm" aria-live="polite">
      <div class="draaier" aria-hidden="true"></div>
      <p data-t="laden"></p>
    </section>

    <section id="scherm-fout" class="scherm" role="alert" hidden>
      <p class="groot-teken" aria-hidden="true"><span data-symbool>!</span></p>
      <div class="terugval">
        <p lang="nl" data-bouw><strong>Er ging iets mis</strong> De game kon niet laden.</p>
        <p lang="en" data-bouw><strong>Something went wrong</strong> The game could not load.</p>
      </div>
      <h2 data-t="fout_titel"></h2>
      <p id="fout-laden" data-t="fout_laden"></p>
      <p id="fout-webgl" data-t="fout_webgl" hidden></p>
      <p id="fout-level" data-t="fout_level" hidden></p>
      <button id="knop-opnieuw" class="knop groot primair" type="button" data-focus data-t-aria="opnieuw_proberen"
        aria-label="Opnieuw proberen / Try again"><span data-symbool aria-hidden="true">↻</span>
        <span class="terugval" data-bouw>Opnieuw proberen / Try again</span><span data-t="opnieuw_proberen"></span></button>
    </section>

    <section id="scherm-start" class="scherm" hidden>
      <h1 data-t="titel"></h1>
      <button id="knop-start" class="knop groot primair" type="button" data-focus data-t="start"></button>
      <div class="besturing-plek"></div>
    </section>

    <section id="scherm-kies" class="scherm" hidden>
      <h2 data-t="kies_held"></h2>
      <div id="helden" class="helden"></div>
    </section>

    <section id="scherm-level" class="scherm" hidden>
      <h2 data-t="kies_level"></h2>
      <div id="levels" class="helden"></div>
    </section>

    <section id="scherm-eind" class="scherm" hidden>
      <div id="confetti" aria-hidden="true"></div>
      <h2 class="feest" data-t="gehaald"></h2>
      <!-- Het podium: de eigen tekening van de gespeelde held, zijn naam en maker, en de verdiende sterren. -->
      <div class="podium-held">
        <img id="eind-held" alt="">
        <div class="eind-wie">
          <p id="eind-naam" class="naam"></p>
          <p class="maker"><span data-t="getekend_door"></span> <span id="eind-maker"></span></p>
          <p id="eind-sterren" class="eind-sterren"><span data-t="sterren"></span> <span id="eind-sterren-rij"></span></p>
        </div>
      </div>
      <p class="vraag" data-t="eind_vraag"></p>
      <div class="eind-knoppen">
        <button id="knop-naar-start" class="knop groot primair" type="button" data-focus data-t="naar_start"></button>
        <button id="knop-volgend" class="knop groot primair" type="button" data-t="volgend_level" hidden></button>
      </div>
    </section>

    <div id="labels" aria-hidden="true"></div>
    <!-- De hartslag van de held (loop D): linksonder in het speelveld, onder de vraag en de terugkoppeling. Het hartje is
         half blauw (zuurstofarm: de rechterkant van het hart, links als je het van voren ziet) en half rood. -->
    <div id="hud-hart" class="pil hart" hidden>
      <svg class="hartje" viewBox="0 0 24 24" aria-hidden="true"><defs><clipPath id="hart-links"><rect width="12" height="24"/></clipPath><clipPath id="hart-rechts"><rect x="12" width="12" height="24"/></clipPath><path id="hart-vorm" d="M12 21s-7-4.4-9.5-8.6C.6 9.1 2.4 5 6.3 5c2.2 0 3.6 1.2 4.4 2.4h.6C12.1 6.2 13.5 5 15.7 5c3.9 0 5.7 4.1 3.8 7.4C19 16.6 12 21 12 21z"/></defs><use href="#hart-vorm" fill="#2f6fdc" clip-path="url(#hart-links)"/><use href="#hart-vorm" fill="#d8262f" clip-path="url(#hart-rechts)"/><use href="#hart-vorm" fill="none" stroke="#1a1a1a" stroke-width="1.4"/></svg>
      <span data-t="hartslag"></span> <span id="hart-bpm" data-getal>85</span>
    </div>
    <!-- De voorraad witte bloedcellen (loop E): rechtsonder, het spiegelbeeld van de hartslag. Bij 0 gedimd met een dikke
         rand (geen rood: rood = zuurstofrijk). -->
    <div id="hud-afweer" class="pil afweer" hidden>
      <span data-t="witte_bloedcellen"></span> <span id="afweer-aantal" data-getal>5</span>
    </div>
    <div id="deeltjes" aria-hidden="true"></div>

    <section id="opdracht" class="opdracht" aria-live="polite" hidden>
      <p class="vraag-regel"><span class="teken" data-symbool aria-hidden="true">?</span><span id="opdracht-vraag"></span></p>
      <ol id="opdracht-antwoorden" class="antwoorden"></ol>
    </section>

    <div id="terugkoppeling" class="terugkoppeling" role="status" hidden>
      <p id="tk-goed" hidden><strong data-t="goed_zo"></strong> <span id="tk-antwoord"></span></p>
      <p id="tk-fout" hidden><strong data-t="hint"></strong> <span id="tk-hint"></span></p>
    </div>

    <div id="besturing-hint" class="hint" hidden><div class="besturing-plek"></div></div>

    <div id="hulp" class="venster" role="dialog" aria-modal="true" aria-labelledby="hulp-titel" hidden>
      <div class="paneel">
        <h2 id="hulp-titel" data-t="hulp"></h2>
        <div class="besturing-plek"></div>
        <h3 data-t="blokjes"></h3>
        <ul class="blokjes">
          <li><span class="staal muur" aria-hidden="true"></span><span data-t="blok_muur"></span></li>
          <li><span class="staal trede" aria-hidden="true"></span><span data-t="blok_trede"></span></li>
          <li><span class="staal finish" aria-hidden="true"></span><span data-t="blok_finish"></span></li>
          <li><span class="staal klep" aria-hidden="true"></span><span data-t="blok_klep"></span></li>
          <li><span class="staal ster" aria-hidden="true"></span><span data-t="blok_ster"></span></li>
          <li><span class="staal vlag" aria-hidden="true"></span><span data-t="blok_checkpoint"></span></li>
          <li><span class="staal lift" aria-hidden="true"></span><span data-t="blok_lift"></span></li>
          <li><span class="staal vlot" aria-hidden="true"></span><span data-t="blok_vlot"></span></li>
          <li><span class="staal vraagblok" aria-hidden="true"></span><span data-t="blok_opdracht"></span></li>
          <li><span class="staal schurk" aria-hidden="true"></span><span data-t="blok_schurk"></span></li>
          <li><span class="staal bal" aria-hidden="true"></span><span data-t="blok_bal"></span></li>
        </ul>
        <button id="knop-sluit" class="knop" type="button" data-t="sluiten"></button>
      </div>
    </div>
  </div>
</main>

<template id="tpl-besturing">
  <div class="besturing">
    <div class="regel">
      <span class="toetsen"><kbd data-symbool>←</kbd><kbd data-symbool>↑</kbd><kbd data-symbool>↓</kbd><kbd data-symbool>→</kbd></span>
      <span class="toetsen"><kbd data-symbool>W</kbd><kbd data-symbool>A</kbd><kbd data-symbool>S</kbd><kbd data-symbool>D</kbd></span>
      <span class="wat" data-t="lopen"></span>
    </div>
    <div class="regel">
      <span class="toetsen"><kbd class="spatie" data-t="spatie"></kbd></span>
      <span class="wat" data-t="springen"></span>
    </div>
    <div class="regel regel-gooien">
      <span class="toetsen"><kbd data-symbool>F</kbd></span>
      <span class="wat" data-t="gooien"></span>
    </div>
    <div class="regel regel-hulp">
      <span class="toetsen"><kbd data-symbool>H</kbd><kbd data-symbool>?</kbd></span>
      <span class="wat" data-t="hulp"></span>
    </div>
    <div class="regel regel-geluid">
      <span class="toetsen"><kbd data-symbool>M</kbd></span>
      <span class="wat" data-t="geluid_aan_uit"></span>
    </div>
  </div>
</template>

<template id="tpl-levelkaart">
  <button class="kaart levelkaart" type="button">
    <span class="nummer" data-symbool></span>
    <span class="naam"></span>
    <span class="maker"><span data-t="gemaakt_door"></span> <span class="wie"></span></span>
    <span class="kies" data-t="speel"></span>
  </button>
</template>

<template id="tpl-kaart">
  <button class="kaart" type="button">
    <img alt="">
    <span class="naam"></span>
    <span class="maker"><span data-t="getekend_door"></span> <span class="wie"></span></span>
    <span class="kies" data-t="kies_mij"></span>
  </button>
</template>
</body>
</html>
